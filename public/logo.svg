<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 128" fill="none">
  <defs>
    <linearGradient id="ef-bg-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131722" />
      <stop offset="50%" stop-color="#0B0D13" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="ef-border-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="ef-cyan-logo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="ef-emerald-logo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="ef-core-logo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="ef-glow-logo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ef-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Container (128x128) -->
  <g transform="translate(0, 0)">
    <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#ef-bg-logo)" />
    <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#ef-glow-logo)" />
    <rect x="6" y="6" width="116" height="116" rx="28" stroke="url(#ef-border-logo)" stroke-width="2.5" />

    <circle cx="64" cy="64" r="40" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="64" cy="64" r="26" stroke="#10B981" stroke-opacity="0.1" stroke-width="1.5" />

    <path d="M34 46C29 51 26 57 26 64C26 71 29 77 34 82" stroke="url(#ef-cyan-logo)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M23 37C15 45 11 54 11 64C11 74 15 83 23 91" stroke="url(#ef-cyan-logo)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4" />

    <path d="M94 46C99 51 102 57 102 64C102 71 99 77 94 82" stroke="url(#ef-emerald-logo)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M105 37C113 45 117 54 117 64C117 74 113 83 105 91" stroke="url(#ef-emerald-logo)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4" />

    <rect x="44" y="54" width="4.5" height="20" rx="2.25" fill="#38BDF8" fill-opacity="0.65" />
    <rect x="53" y="40" width="5" height="48" rx="2.5" fill="url(#ef-cyan-logo)" />
    <rect x="61.5" y="28" width="5.5" height="72" rx="2.75" fill="url(#ef-core-logo)" />
    <rect x="70.5" y="42" width="5" height="44" rx="2.5" fill="url(#ef-emerald-logo)" />
    <rect x="79.5" y="56" width="4.5" height="16" rx="2.25" fill="#34D399" fill-opacity="0.65" />

    <path d="M26 64H38L47 50L56 78L64 36L72 84L81 54L90 64H102" stroke="#FFFFFF" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="64" cy="36" r="3" fill="#FFFFFF" />
    <circle cx="64" cy="36" r="6" fill="#38BDF8" fill-opacity="0.4" />
  </g>

  <!-- Typography Brand Mark -->
  <g transform="translate(144, 0)">
    <text x="0" y="66" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#FFFFFF">ECHO<tspan fill="url(#ef-text-grad)">FACTORY</tspan></text>
    <text x="2" y="90" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="4" fill="#94A3B8">SMART MANUFACTURING</text>
  </g>
</svg>
